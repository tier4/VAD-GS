[project]
name = "vad-gs"
version = "0.1.0"
description = "Visibility-Aware Densification for 3D Gaussian Splatting in Dynamic Urban Scenes"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "bidict",
    "diff_gaussian_rasterization",
    "imageio",
    "imageio-ffmpeg",
    "imgaug",
    "imgviz",
    "ipdb",
    "kornia",
    "lpips",
    "matplotlib",
    "numba==0.58.1",
    "numpy==1.23.5",
    "nvdiffrast",
    "open3d",
    "opencv-python",
    "patchmatch_cuda",
    "pillow==9.5.0",
    "plyfile",
    "protobuf==3.19",
    "psutil==7.1.3",
    "pynvml>=11.5.3",
    "pyyaml",
    "roma",
    "segment_anything",
    "simple_knn",
    "simple_waymo_open_dataset_reader",
    "sympy",
    "tensorboard",
    "termcolor",
    "timm",
    "torch==2.4.0+cu124; sys_platform == 'linux'",
    "torch==2.4.0; sys_platform == 'darwin'",
    "torchmetrics",
    "torchvision==0.19.0+cu124; sys_platform == 'linux'",
    "torchvision==0.19.0; sys_platform == 'darwin'",
    "tqdm",
    "transformers>=5.2.0",
    "t4-devkit",
]

[tool.uv]
package = false
dependency-metadata = [
    { name = "diff_gaussian_rasterization", version = "0.0.0" },
    { name = "patchmatch_cuda", version = "0.0.0" },
    { name = "simple_knn", version = "0.0.0" },
    { name = "simple_waymo_open_dataset_reader", version = "0.0.0", requires-dist = ["protobuf"] },
]

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = [{ requirement = "torch", match-runtime = true }]
nvdiffrast = [{ requirement = "torch", match-runtime = true }]
patchmatch-cuda = [{ requirement = "torch", match-runtime = true }]
simple-knn = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
diff_gaussian_rasterization = { path = "submodules/diff-gaussian-rasterization" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git" }
patchmatch_cuda = { path = "submodules/MyPropagation" }
simple_knn = { path = "submodules/simple-knn" }
simple_waymo_open_dataset_reader = { path = "submodules/simple-waymo-open-dataset-reader" }
t4-devkit = { git = "https://github.com/tier4/t4-devkit.git", tag = "v0.6.0" }

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Suppress errors for unresolvable third-party / C-extension modules
unresolved-import = "ignore"
# numpy/torch overload resolution often fails with ty
no-matching-overload = "warn"
# numba prange not recognized as iterable
not-iterable = "warn"
# nn.Module method overrides with different signatures (intentional)
invalid-method-override = "warn"
# unresolved attributes from cfg, external libs, and Optional narrowing
unresolved-attribute = "warn"
# numpy subscript on Optional types guarded at runtime
not-subscriptable = "warn"
# Optional fields used after runtime guards (e.g. if self.include_obj)
call-non-callable = "warn"
# numpy/torch operator overloads not fully resolved
unsupported-operator = "warn"
# Subscript assignments on variables narrowed to None (runtime-guarded)
invalid-assignment = "warn"
# Some torch utility function arg types not fully resolved
invalid-argument-type = "warn"
