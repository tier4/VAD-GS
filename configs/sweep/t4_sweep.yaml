# wandb sweep config for VAD-GS T4 training.
#
# Focus (this revision): the BACKGROUND model. lsobybow (the previous
# bayes sweep, optimized for `test/test_view/psnr_obj`) confirmed that
# `obj_shape_pena` saturates at ~1.001 regardless of λ_shape — the obj
# anisotropy penalty is doing its job on the few hundred actor Gaussians,
# but the visually-bad "needle-shaped" Gaussians the user is seeing live
# in the BG model (signs, poles, parked cars, foreground BG within ~30m
# of the ego), which the obj-only penalty cannot reach. lsobybow's 8
# finished runs all clustered at psnr_obj 15.65-15.94 (0.3dB band) — the
# existing sweep axes had run out of useful signal.
#
# This revision changes the experiment:
#   1. Sweep metric → overall `test/test_view/psnr` (BG static-FG is
#      30-40% of pixels; improvements there dominate the overall PSNR
#      gradient, unlike obj which is 5-15%). Per-layer PSNRs
#      (psnr_bkgd_near / psnr_bkgd_far / psnr_sky / psnr_obj) are logged
#      separately for post-hoc analysis (train.py:training_report).
#   2. New axis: `lambda_shape_pena_bkgd` — the same anisotropy penalty
#      (smax/smin) applied to the BG model (train.py:loss_bkgd_shape).
#      Range starts much lower than the obj-side λ because BG has
#      orders-of-magnitude more Gaussians and contains legitimately flat
#      road geometry that over-regularization would crush to spheres.
#   3. Compensating axis: `densify_grad_threshold_bkgd` — isotropizing
#      pancake BG Gaussians halves their on-screen coverage (~a² → ~0.7a²
#      at constant volume), so density has to compensate or holes appear.
#      Range pushes the threshold down by ~2-3x from the base default to
#      let the densifier pick up the slack.
#   4. Other lsobybow-saturated knobs are pinned to their lsobybow-best
#      values via base.yaml / fixed sweep entries below, freeing search
#      budget for the new BG axes.
#
# Usage:
#   1. Create the sweep:
#        SWEEP_ID=$(python script/sweep/sweep_init.py configs/sweep/t4_sweep.yaml)
#   2. Launch N parallel agents (one per GPU):
#        NUM_AGENTS=8 SWEEP_ID=$SWEEP_ID bash script/sweep/sweep_launch.sh

program: script/sweep/sweep_run.py
method: bayes

metric:
  # Overall PSNR. BG static-foreground (the layer we're trying to fix)
  # is the largest single layer by pixel count, so the optimizer gets
  # strong gradient there. Per-layer PSNRs are still logged for analysis.
  name: test/test_view/psnr
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --base-config
  - configs/sweep/base.yaml
  - ${args}

# Early stop weak runs once we have signal.
# With min_iter=10000 and eta=2, the rung iterations land at
# {10000, 20000, 40000, 50000} — matching the test_iterations in base.yaml.
early_terminate:
  type: hyperband
  min_iter: 10000
  eta: 2

parameters:
  # ===== NEW BG axes (the experiment) ==================================

  # Anisotropy penalty on BG Gaussians (smax/smin). 0 = off. Range is
  # ~1 OOM below the obj-side range because:
  #   (a) BG has ~1.7M-7.6M Gaussians vs ~10²-10³ obj — same λ would
  #       contribute ~10⁴x more to the loss
  #   (b) BG contains legitimate pancakes (road surface) we don't want
  #       to crush — too-high λ flattens road quality
  optim.lambda_shape_pena_bkgd:
    values: [0., 1.0e-6, 5.0e-6, 2.0e-5, 1.0e-4]

  # BG densify gradient threshold. Lower = more BG densification.
  # Compensates for the screen-coverage loss when BG Gaussians are
  # isotropized by the shape penalty above. Base default is 1.0e-3;
  # range here goes down to 3.0e-4 (3x more aggressive).
  optim.densify_grad_threshold_bkgd:
    distribution: log_uniform_values
    min: 3.0e-04
    max: 1.5e-03

  # Extends the BG densification window to give the post-shape-penalty
  # state time to backfill holes. base.yaml default is 25000.
  optim.densify_until_iter:
    values: [25000, 30000, 35000]

  # Clone if scale <= percent_dense * extent, else split. Smaller BG
  # Gaussians (from shape penalty) tilt this toward clone — keeping
  # 0.01 in the range lets split stay active.
  optim.percent_dense:
    values: [0.005, 0.01]

  # ===== Pinned from lsobybow (top-quartile values) =====================
  # These ran out of signal in lsobybow (the 8 finished runs clustered
  # in a 0.3dB band on psnr_obj). Pinned via single-value sweep entries
  # so they stay explicit in the sweep manifest while not consuming
  # bayes-optimizer budget.

  # Obj shape penalty: lsobybow top-4 (psnr_obj 15.83-15.94) all had
  # λ_shape ∈ {1e-4, 5e-4}. Pin at 5e-4 — that's giddy-sweep-7's value
  # (the lsobybow #1).
  optim.lambda_shape_pena:
    value: 0.0005

  # Obj densify threshold: top-4 lsobybow values were
  # {3.4e-5, 6.1e-5, 5.8e-5, 1.2e-4}. Pin at 5e-5 (cluster center).
  optim.densify_grad_threshold_obj:
    value: 0.00005

  # Opacity prune: top-4 lsobybow values were {1.10e-2, 9.06e-3,
  # 1.14e-2, 1.30e-2}. Pin at 0.01 (upstream default, near cluster).
  optim.min_opacity:
    value: 0.01

  # Screen-size prune: 20 is the upstream default; top-2 lsobybow had
  # max_screen_size=20.
  optim.max_screen_size:
    value: 20

  # Big-WS prune: top-3 lsobybow values were {0.2, 0.2, 0.2}.
  optim.percent_big_ws:
    value: 0.2

  # Opacity reset: top-3 lsobybow values were {3000, 3000, 3000}.
  optim.opacity_reset_interval:
    value: 3000

  # Densify cadence: top-2 lsobybow values were {100, 50}. Pin at 100
  # (upstream default).
  optim.densification_interval:
    value: 100
