# wandb sweep config for VAD-GS T4 training.
#
# Focus: foreground (object) densification. Background / sky already look
# acceptable in the reference run, so bkgd-specific knobs are pinned and
# we explore obj-side gradient thresholds + the shared densify/prune
# parameters (percent_dense, percent_big_ws, min_opacity, ...) that affect
# how aggressively foreground Gaussians clone, split, and survive pruning.
#
# Loss weights and LRs are intentionally *not* swept here — those affect
# everything globally; once a good densification operating point is found
# we can sweep them in a second pass.
#
# Usage:
#   1. Create the sweep:
#        SWEEP_ID=$(python script/sweep/sweep_init.py configs/sweep/t4_sweep.yaml)
#   2. Launch N parallel agents (one per GPU):
#        NUM_AGENTS=8 SWEEP_ID=$SWEEP_ID bash script/sweep/sweep_launch.sh
#
# The agent invokes script/sweep/sweep_run.py, which loads
# configs/sweep/base.yaml as the baseline and overrides the keys
# listed under `parameters` below using yacs `key value` format.

# entity / project are normally pulled from .env (WANDB_ENTITY / WANDB_PROJECT)
# by script/sweep/sweep_init.py, so they are intentionally NOT hardcoded here.
program: script/sweep/sweep_run.py
method: bayes

metric:
  # Run-level summary written by training_report() after each test eval.
  # Reflects the best test-view PSNR observed during the run.
  name: test/test_view/best_psnr
  goal: maximize

# wandb agent will pass each sampled config as `--key=value` CLI args.
# sweep_run.py reads them back via wandb.config and converts to yacs opts.
command:
  - ${env}
  - python
  - ${program}
  - --base-config
  - configs/sweep/base.yaml
  - ${args}

# Early stop weak runs once we have signal.
# With min_iter=3000 and eta=3, the rung iterations land roughly at
# {3000, 9000, 27000, 50000} — matching the test_iterations in base.yaml
# so the early-stop decision is taken at a real test eval.
early_terminate:
  type: hyperband
  min_iter: 3000
  eta: 3

parameters:
  # ----- Foreground-only knobs -----------------------------------------

  # Object-side gradient threshold for clone/split. Lower => more
  # foreground Gaussians get cloned/split. This is the single biggest
  # knob for foreground geometry quality.
  # Default 2.0e-4; sweep over ~1 decade either side.
  optim.densify_grad_threshold_obj:
    distribution: log_uniform_values
    min: 2.0e-05
    max: 1.0e-03

  # AbsGS-style absolute-gradient densification on objects: ranks
  # candidates by |∂L/∂μ| instead of ∂L/∂μ. Sometimes catches
  # high-frequency object edges the signed gradient misses.
  optim.densify_grad_abs_obj:
    values: [false, true]

  # ----- Shared densify/prune knobs (affect both bkgd and obj, but ----
  # the bkgd path is robust to them — leaving room to find a better
  # operating point for foreground) -------------------------------------

  # Clone if scale <= percent_dense * extent, else split. Smaller =>
  # more clones (densifies thin structures), larger => more splits
  # (rebuilds large surfaces).
  optim.percent_dense:
    values: [0.005, 0.01, 0.02, 0.03]

  # Big-point pruning aggressiveness (world-space). Lower => prune more
  # aggressively; foreground often needs this looser so vehicles /
  # pedestrians don't get cleared mid-training.
  optim.percent_big_ws:
    values: [0.05, 0.1, 0.2, 0.4]

  # Opacity prune threshold. Lower keeps more low-opacity points alive
  # long enough to recover; higher prunes faster.
  optim.min_opacity:
    distribution: log_uniform_values
    min: 0.005
    max: 0.05

  # Screen-space big-point pruning. 0 disables, otherwise larger keeps
  # bigger projected Gaussians (helps foreground at close range).
  optim.max_screen_size:
    values: [0, 20, 40, 80]

  # Tiny-radii pruning. 0 disables. 1 prunes 1-pixel splats. Larger
  # values prune more aggressively — foreground sometimes loses
  # detail when this is non-zero.
  optim.prune_small_radii:
    values: [0, 1, 2]

  # ----- Densification schedule ----------------------------------------

  # Densify every N iterations. Faster cadence => more clones per epoch
  # but also more transient grad noise.
  optim.densification_interval:
    values: [50, 100, 200]

  # When to start densifying. Later start lets initial bkgd PLY warm up.
  optim.densify_from_iter:
    values: [250, 500, 1000]

  # When to stop densifying. Later end means more foreground refinement
  # but risks oscillation against opacity-reset.
  optim.densify_until_iter:
    values: [25000, 35000, 40000, 45000]

  # Opacity reset cadence: aggressive reset prunes too hard, but never
  # resetting leaves stale Gaussians.
  optim.opacity_reset_interval:
    values: [3000, 5000, 8000, 12000]
