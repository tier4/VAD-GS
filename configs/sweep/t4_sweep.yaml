# wandb sweep config for VAD-GS T4 training.
#
# Focus: foreground (object) quality — specifically the "flat / needle"
# failure mode seen in renders. ad2ukmu6 (the previous bayes sweep)
# optimized whole-image PSNR, which is dominated by background pixels.
# The optimizer therefore could not see foreground degradation:
# `densify_grad_threshold_obj` had corr ≈ -0.05 with the sweep metric.
#
# This revision:
#   1. Switches the sweep metric to a per-pixel foreground PSNR
#      (`test/test_view/psnr_obj`), computed in train.py:training_report
#      using the dynamic_mask guidance already loaded on each viewpoint.
#   2. Tightens the densify/prune ranges to match the upstream Waymo /
#      nuScenes defaults (the ad2ukmu6 ranges had drifted far enough that
#      upstream values were excluded from the search space — e.g.
#      percent_big_ws=0.1 and max_screen_size=20 were never tried).
#   3. Adds `lambda_shape_pena` (anisotropy penalty on object Gaussians,
#      train.py:loss_obj_shape) to the sweep — direct attack on the flat
#      Gaussian symptom.
#   4. Pins `densify_grad_abs_obj=True` (AbsGS) in base.yaml: the previous
#      sweep showed False slightly better, but only under the
#      foreground-blind metric. AbsGS is the canonical fix for flat
#      Gaussians at high-frequency edges, so we restore it.
#
# Usage:
#   1. Create the sweep:
#        SWEEP_ID=$(python script/sweep/sweep_init.py configs/sweep/t4_sweep.yaml)
#   2. Launch N parallel agents (one per GPU):
#        NUM_AGENTS=8 SWEEP_ID=$SWEEP_ID bash script/sweep/sweep_launch.sh

program: script/sweep/sweep_run.py
method: bayes

metric:
  # Foreground PSNR (computed only on pixels where dynamic_mask != 255).
  # Hardens the bayes optimizer against the BG-bias that wrecked the
  # previous sweep.
  name: test/test_view/psnr_obj
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --base-config
  - configs/sweep/base.yaml
  - ${args}

# Early stop weak runs once we have signal.
# With min_iter=10000 and eta=2, the rung iterations land at
# {10000, 20000, 40000, 50000} — matching the test_iterations in base.yaml.
early_terminate:
  type: hyperband
  min_iter: 10000
  eta: 2

parameters:
  # ----- Foreground-only knobs -----------------------------------------

  # Object-side gradient threshold for clone/split. Lower => more
  # foreground Gaussians get cloned/split. Range pushed lower than the
  # previous sweep ([5e-5, 3e-4]) — under the foreground PSNR metric we
  # want growth-friendly bias.
  optim.densify_grad_threshold_obj:
    distribution: log_uniform_values
    min: 3.0e-05
    max: 1.5e-04

  # Anisotropy penalty on object Gaussians (max_scale / min_scale).
  # 0 = off (no penalty). Directly attacks the "flat / needle" failure
  # mode. Computed in train.py:loss_obj_shape; applies only to object
  # Gaussians (BG retains its anisotropy). Range shifted down by ~1 OOM
  # after the smoke run: lambda=0.001 crushed obj_shape_pena to ~1.0017
  # (essentially perfect spheres) within 5k iter, which over-regularizes
  # objects that legitimately need anisotropy (vehicle bodies, mirrors).
  optim.lambda_shape_pena:
    values: [0., 0.00005, 0.0001, 0.0005]

  # ----- Shared densify/prune knobs ------------------------------------

  # Clone if scale <= percent_dense * extent, else split. Smaller =>
  # more clones (densifies thin structures). Includes upstream default
  # (0.01) and a more growth-friendly 0.003 below the sweep low end.
  optim.percent_dense:
    values: [0.003, 0.005, 0.01]

  # Big-point pruning aggressiveness (world-space). 0.1 is the upstream
  # nuScenes / Waymo default and was outside the previous sweep range —
  # restored as the lower bound here.
  optim.percent_big_ws:
    values: [0.1, 0.2]

  # Opacity prune threshold.
  optim.min_opacity:
    distribution: log_uniform_values
    min: 0.005
    max: 0.015

  # Screen-space big-point pruning. 20 is the upstream default — was
  # excluded from the previous sweep ({0, 40, 80}). 40 was the worst
  # value in ad2ukmu6 and is dropped.
  optim.max_screen_size:
    values: [20, 80]

  # ----- Densification schedule ----------------------------------------

  optim.densification_interval:
    values: [50, 100]

  # When to stop densifying. 25000 follows Waymo upstream (50% of the
  # 50k budget — leaves 25k iter for the post-densify shaping phase
  # where obj_acc_loss fires). 30000 as a small bracket.
  optim.densify_until_iter:
    values: [20000, 25000, 30000]

  # Opacity reset cadence. 5000 was the worst value in ad2ukmu6 and is
  # dropped. 3000 is the upstream default and best ad2ukmu6 value.
  optim.opacity_reset_interval:
    values: [3000, 5000]
