task: t4_exp
# source_path accepts either:
#   - A dataset UUID: caf37e66-a2aa-4f5e-9f87-b4e63a106bbd
#   - A full path:    /home/user/.webauto/data/data/annotation_dataset/caf37e66-.../0
#   - A relative path: data/t4/my_dataset
source_path: 433a2328-a5a6-4790-87d3-59e930ac7020

# exp_name is overridden per-run by script/sweep/sweep_run.py (using the wandb run id)
# so output dirs do not collide between parallel agents.
exp_name: tokyo_teleport_sweep

# Single-GPU sweep — explicit dist section so train.py does not try to
# coordinate ranks even when WORLD_SIZE happens to be set in the environment.
dist:
  enabled: false
  backend: nccl

data:
  type: T4
  white_background: false
  split_test: 4
  split_train: -1
  selected_frames: [0, 140]  # 0秒~14秒 (141フレーム × 5カメラ ≒ 705枚, 10Hz)

  scene_index: 0
  version: 2
  revision: 0
  camera_channels:
    - CAM_FRONT
    - CAM_FRONT_LEFT
    - CAM_FRONT_RIGHT
    - CAM_BACK_LEFT
    - CAM_BACK_RIGHT
  lidar_channel: LIDAR_CONCAT
  cameras: [0, 1, 2, 3, 4]

  extent: 10
  use_colmap: true
  filter_colmap: true
  box_scale: 1.5
  shuffle: false

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: true
    opt_track: true
    flatten_loss: true

# --- Full single-GPU schedule -------------------------------------------
# Sweep at the production length (50000 iter) so the tuning we find can
# be used as-is. Hyperband (configured in t4_sweep.yaml) culls weak runs
# at the early test rungs so we do not pay full cost for every config.
# test_iterations are placed near the hyperband rungs (~min_iter,
# ~min_iter*eta, ...) so the early-stop signal lands on real evals.
train:
  iterations: 50000
  # Aligned with the hyperband rungs in t4_sweep.yaml
  # (min_iter=10000, eta=2 => {10000, 20000, 40000, 50000}) so the
  # early-stop decision lands on a real test evaluation.
  test_iterations: [10000, 20000, 40000, 50000]
  save_iterations: [50000]
  checkpoint_iterations: [50000]
  # Sweep agents are CPU/disk-bound when 8 of them lazy-load jpegs from the
  # same dataset every iter. Preloading all train views to VRAM removes the
  # contention at the cost of ~7GB per GPU (well within H100's 80GB).
  preload_vram: true

optim:
  use_amp: false
  error_tolerance: 0.01
  prune_box_interval: 100
  densification_interval: 100
  prop_voxel_interval: 5

  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.001
  densify_grad_abs_bkgd: True
  densify_grad_threshold_obj: 0.0002
  densify_grad_abs_obj: False
  densify_until_iter: 40000

  hard_depth_start: 0
  hard_depth_end: 40000
  propagated_iteration_begin: 0
  propagated_iteration_end: 40000
  propagation_interval: 5
  lambda_shape_pena: 0
  lambda_scale_pena: 0

  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.01
  opacity_lr: 0.05
  opacity_reset_interval: 5000
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 1.6e-05
  position_lr_max_steps: 70000
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  lambda_dssim: 0.2
  lambda_sky: 0.05
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1

  track_position_lr_delay_mult: 0.01
  track_position_lr_init: 0.005
  track_position_lr_final: 5.0e-5
  track_position_max_steps: 50000

  track_rotation_lr_delay_mult: 0.01
  track_rotation_lr_init: 0.001
  track_rotation_lr_final: 1.0e-5
  track_rotation_max_steps: 50000

  normal_loss: True
  use_voxel_depth: True
  use_lidar_depth: False
  skip_view_selection: False

render:
  fps: 24
  concat_cameras: [1, 0, 2]
  render_normal: True
