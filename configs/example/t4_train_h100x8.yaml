task: t4_exp
# source_path accepts either:
#   - A dataset UUID: caf37e66-a2aa-4f5e-9f87-b4e63a106bbd
#   - A full path:    /home/user/.webauto/data/data/annotation_dataset/caf37e66-.../0
#   - A relative path: data/t4/my_dataset
source_path: 433a2328-a5a6-4790-87d3-59e930ac7020
exp_name: tokyo_teleport_h100x8

# --- Multi-GPU distributed training --------------------------------------
# Enable with: torchrun --nproc_per_node=8 train.py --config <this file>
# Disable (single-GPU): remove this section or set enabled: false
dist:
  enabled: true
  backend: nccl

data:
  type: T4
  white_background: false
  split_test: 4
  split_train: -1
  selected_frames: [0, 140]  # 0秒~14秒 (141フレーム × 5カメラ ≒ 705枚, 10Hz)

  # T4-specific settings
  scene_index: 0
  version: 2
  revision: 0
  camera_channels:
    - CAM_FRONT
    - CAM_FRONT_LEFT
    - CAM_FRONT_RIGHT
    - CAM_BACK_LEFT
    - CAM_BACK_RIGHT
  lidar_channel: LIDAR_CONCAT
  cameras: [0, 1, 2, 3, 4]

  extent: 10
  use_colmap: true
  filter_colmap: true
  box_scale: 1.5
  shuffle: false

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: true
    opt_track: true
    flatten_loss: true

# --- Iteration scaling for multi-GPU ------------------------------------
# Each iter consumes world_size (=8) images via data-parallel averaging,
# so iter-based schedules below are 1/8 of the single-GPU baseline in
# configs/example/t4_train_example.yaml. propagation_interval and
# *_interval values that count *param updates* (not data) are kept the
# same as single-GPU.
train:
  iterations: 6250
  test_iterations: [1250, 3125, 6250]
  save_iterations: [6250]
  checkpoint_iterations: [625, 1250, 2500, 4375, 6250]

optim:
  use_amp: false  # disabled: AMP loss-scale collapsed to 0 around iter 100 in multi-GPU; revisit once training is stable.
  error_tolerance: 0.01
  prune_box_interval: 100         # param-update cadence; keep as-is
  densification_interval: 100     # param-update cadence; keep as-is
  prop_voxel_interval: 5

  densify_from_iter: 64           # ~500/8
  densify_grad_threshold_bkgd: 0.001
  densify_grad_abs_bkgd: True
  densify_grad_threshold_obj: 0.0002
  densify_grad_abs_obj: False
  densify_until_iter: 5000        # 40000/8

  hard_depth_start: 0
  hard_depth_end: 5000            # 40000/8
  propagated_iteration_begin: 0
  propagated_iteration_end: 5000  # 40000/8
  propagation_interval: 5         # view-stack-epoch units; rank-local, keep as-is
  lambda_shape_pena: 0
  lambda_scale_pena: 0

  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.01
  opacity_lr: 0.05
  opacity_reset_interval: 625     # 5000/8
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 1.6e-05
  position_lr_max_steps: 8750     # 70000/8 — match shorter iteration schedule
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  lambda_dssim: 0.2
  lambda_sky: 0.05
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1

  track_position_lr_delay_mult: 0.01
  track_position_lr_init: 0.005
  track_position_lr_final: 5.0e-5
  track_position_max_steps: 6250  # 50000/8

  track_rotation_lr_delay_mult: 0.01
  track_rotation_lr_init: 0.001
  track_rotation_lr_final: 1.0e-5
  track_rotation_max_steps: 6250  # 50000/8

  normal_loss: True
  use_voxel_depth: True
  use_lidar_depth: False
  skip_view_selection: False

render:
  fps: 24
  concat_cameras: [1, 0, 2]
  render_normal: True
